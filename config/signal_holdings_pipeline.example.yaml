# Complete direct PipelineConfig example for the V5 development chain:
# files -> Modeling Panel -> ML -> Signal -> Holdings.
# Replace only the two Modeling Panel input paths before a real run.
backtest_start: "2024-01-01"
backtest_end: "2024-12-31"
train_years: 1
max_lookback_months: 1
stock_pool: hs300
benchmark: 000300.SH
strategy_name: signal_holdings_example
selected_factors: []
rebalance_frequency: M
# Legacy workflow field. It must match enabled holdings.top_n, but it is not
# the canonical V5 Holdings parameter.
top_n: 10
transaction_cost: 0.001
data_root: data
raw_data_dir: data/raw
processed_data_dir: data/processed
cache_dir: data/cache
output_dir: data/output
parquet_engine: auto
required_datasets: []

factor_research:
  enabled: false

modeling_panel:
  enabled: true
  source:
    mode: files
    factor_panel_path: data/processed/modeling_factor_panel.parquet
    forward_returns_path: data/processed/modeling_forward_returns.parquet
  builder:
    label_column: forward_return
    include_features: null
    exclude_features: []
    unmatched_policy: audit_and_drop
    require_entry_after_signal: true
    allow_missing_labels: true
  output:
    save_artifact: true
    artifact_subdir: modeling_panel
    parquet_compression: zstd
    verify_after_write: true

ml_experiment:
  enabled: true
  panel_path: null
  save_artifacts: true
  artifact_root: ml_artifacts
  experiment_id: signal_holdings_example
  parquet_compression: zstd
  experiment:
    dataset:
      label_col: forward_return
    walk_forward:
      train_window_periods: 252
      validation_periods: 20
      window_type: rolling
      retrain_frequency: 20
      embargo_periods: 1
    training:
      model_name: ridge
      model_params:
        alpha: 1.0
    evaluation:
      minimum_cross_section_size: 3
    permutation_importance: null

signal:
  enabled: true
  source:
    mode: ml
    artifact_dir: null
  prediction_column: prediction
  signal_direction: descending
  artifact_subdir: signal

holdings:
  enabled: true
  # User-selected example value. The backend canonical default remains 20.
  top_n: 10
  insufficient_universe_policy: error
  weighting: equal_weight
  artifact_subdir: holdings
