# Complete direct PipelineConfig example for the V6 research chain.
# Replace the Modeling Panel input paths before a real run.
backtest_start: "2024-01-01"
# Canonical evaluation end date for the entire run and Research Backtest.
backtest_end: "2024-12-31"
train_years: 1
max_lookback_months: 1
stock_pool: hs300
benchmark: 000300.SH
strategy_name: research_backtest_example
selected_factors: []
rebalance_frequency: M
# Legacy root field must match enabled holdings.top_n. Research Backtest does
# not read this field or perform selection.
top_n: 10
transaction_cost: 0.001
data_root: data
raw_data_dir: data/raw
processed_data_dir: data/processed
cache_dir: data/cache
output_dir: data/output
parquet_engine: auto
required_datasets: []

factor_research:
  enabled: false

modeling_panel:
  enabled: true
  source:
    mode: files
    factor_panel_path: data/processed/modeling_factor_panel.parquet
    forward_returns_path: data/processed/modeling_forward_returns.parquet
  builder:
    label_column: forward_return
    include_features: null
    exclude_features: []
    unmatched_policy: audit_and_drop
    require_entry_after_signal: true
    allow_missing_labels: true
  output:
    save_artifact: true
    artifact_subdir: modeling_panel
    parquet_compression: zstd
    verify_after_write: true

ml_experiment:
  enabled: true
  panel_path: null
  save_artifacts: true
  artifact_root: ml_artifacts
  experiment_id: research_backtest_example
  parquet_compression: zstd
  experiment:
    dataset:
      label_col: forward_return
    walk_forward:
      train_window_periods: 252
      validation_periods: 20
      window_type: rolling
      retrain_frequency: 20
      embargo_periods: 1
    training:
      model_name: ridge
      model_params:
        alpha: 1.0
    evaluation:
      minimum_cross_section_size: 3
    permutation_importance: null

signal:
  enabled: true
  source:
    mode: ml
    artifact_dir: null
  prediction_column: prediction
  signal_direction: descending
  artifact_subdir: signal

holdings:
  enabled: true
  top_n: 10
  insufficient_universe_policy: error
  weighting: equal_weight
  artifact_subdir: holdings

research_backtest:
  enabled: true
  source:
    mode: pipeline
    artifact_dir: null
  schedule:
    mode: holdings_dates
  return_alignment:
    effective_rule: next_trading_day
    return_convention: adjusted_close_to_close
  portfolio:
    initial_nav: 1.0
    turnover_definition: half_l1_pre_to_target
  # These are explicit example choices, not backend defaults.
  transaction_cost:
    cost_bps: 10
    rate_basis: one_way_traded_notional
  benchmark:
    benchmark_code: 000300.SH
    alignment_policy: strict_common_calendar
  performance:
    annualization_days: 252
    annual_risk_free_rate: 0.0
  artifact_subdir: research_backtest
